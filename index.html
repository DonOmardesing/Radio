.ft{padding:22px 16px 32px;border-top:2px solid #0a84ff;margin-top:16px}
.md{position:fixed;inset:0;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;padding:16px;z-index:9999}.md.on{display:flex}

};
let fl=pls.slice(),ix=0;
function rn(){
  const tr=document.getElementById('tr'),w=document.getElementById('wr').clientWidth;
  tr.innerHTML='';
  fl.forEach((p,i)=>{
    const d=document.createElement('div');d.className='sl';d.style.width=w+'px';
    const pad=String(p.n).padStart(2,'0');
    const imgSrc=buenas[p.n];
    d.innerHTML=`<img src="${imgSrc}"><div class="co">${i+1}/${fl.length}</div><div class="ci">${pad} • ${p.t}</div><div class="pl" onclick="op('${p.id}')">▶</div>`;
    tr.appendChild(d);
  });
  tr.style.width=fl.length*w+'px';up();
}
function up(){const w=document.getElementById('wr').clientWidth;document.getElementById('tr').style.transform=`translateX(-${ix*w}px)`;}
function op(id){document.getElementById('em').innerHTML=`<iframe src="https://open.spotify.com/embed/playlist/${id}" width="100%" height="380" frameborder="0" allow="encrypted-media"></iframe>`;document.getElementById('md').classList.add('on');}
document.getElementById('cl').onclick=()=>{document.getElementById('md').classList.remove('on');document.getElementById('em').innerHTML='';};
document.getElementById('ab').onclick=()=>{fl=pls.slice();ix=0;rn();};
let sx=0,dx=0,isH=false;
const wr=document.getElementById('wr');
wr.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
wr.addEventListener('touchmove',e=>{dx=e.touches[0].clientX-sx;if(!isH&&Math.abs(dx)>10){isH=true;}if(isH){e.preventDefault();}},{passive:false});
wr.addEventListener('touchend',e=>{if(isH){if(dx<-40&&ix<fl.length-1){ix++;up();}if(dx>40&&ix>0){ix--;up();}}sx=0;isH=false;},{passive:true});
rn();
