<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Don Omar Radio 73</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
main{padding:12px 0 0}

/* HEADER */
.hd{
  max-width:760px;
  margin:0 auto 18px;
  border:3px solid #0a84ff;
  border-radius:18px;
  overflow:hidden;
  line-height:0;
}
.hd img{
  width:100%;
  display:block;
}

/* PANEL CENTRAL */
.panel{text-align:center;padding:0 10px}
h1{
  margin:0 auto;
  max-width:720px;
  font-size:20px;
  font-weight:900;
  line-height:1.15;
  text-align:center;
}
.sub{
  color:#4ade80;
  font-size:18px;
  font-weight:900;
  margin-top:10px;
}
.hint{
  color:#4ade80;
  font-size:11px;
  letter-spacing:.28em;
  font-weight:700;
  margin-top:7px;
}

/* BOTONES */
.gbtn{
  width:92vw;
  max-width:360px;
  height:60px;
  border-radius:999px;
  border:1.5px solid #4ade80;
  background:#000;
  box-shadow:0 0 18px rgba(74,222,128,.35);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  margin:14px auto 0;
  cursor:pointer;
  color:#fff;
}
.gicon{
  width:46px;
  height:46px;
  min-width:46px;
  border-radius:50%;
  background:#4ade80;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  font-weight:900;
}
#gt{
  flex:1;
  font-size:13px;
  font-weight:900;
  text-align:center;
  padding:0 8px;
}
.arrow{color:#4ade80;font-size:17px}

#bx{
  display:none;
  max-width:380px;
  width:92vw;
  margin:12px auto;
  background:#111;
  border-radius:16px;
  padding:10px;
  border:1px solid #222;
}
.ge{
  padding:13px 16px;
  margin:6px 0;
  background:#1a1a1a;
  border-radius:11px;
  font-weight:800;
  font-size:13px;
  cursor:pointer;
  text-align:left;
}
.ge.ac{background:#4ade80;color:#000}

/* SLIDER */
.wr{
  width:90vw;
  max-width:760px;
  margin:14px auto 0;
  overflow:hidden;
}
.tr{
  display:flex;
  transition:transform .35s ease;
}
.sl{
  width:90vw;
  max-width:760px;
  flex-shrink:0;
  position:relative;
  background:#080808;
  border-radius:18px;
  overflow:hidden;
}
.sl img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
}
.ci{
  position:absolute;
  top:0;
  left:0;
  right:0;
  background:rgba(0,0,0,.65);
  padding:10px 16px;
  font-weight:800;
  font-size:12px;
  text-align:left;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.co{
  position:absolute;
  bottom:10px;
  left:10px;
  background:rgba(0,0,0,.7);
  padding:5px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}
.pl{
  position:absolute;
  bottom:10px;
  right:10px;
  width:54px;
  height:54px;
  border-radius:50%;
  border:2px solid #0a84ff;
  background:rgba(0,0,0,.8);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:20px;
}

/* FOOTER */
footer{
  padding:22px 16px 30px;
  border-top:2px solid #0a84ff;
  margin-top:16px;
  background:#000;
  text-align:center;
}
.social{
  display:flex;
  justify-content:center;
  gap:11px;
  margin-bottom:17px;
}
.social button{
  width:65px;
  height:65px;
  border:0;
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:900;
  color:#fff;
  cursor:pointer;
}
.yt{background:#ff0000}
.sp{background:#1DB954}
.wa{background:#25D366}
.sh{background:#222}
.dr{
  width:52px;
  height:52px;
  border-radius:50%;
  background:#4ade80;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  margin:0 auto 9px;
  font-size:18px;
}
.brand{
  font-family:'Brush Script MT',cursive;
  font-size:23px;
}
.small{
  color:#0a84ff;
  font-size:10px;
  font-weight:800;
  letter-spacing:.08em;
  margin-top:7px;
}
</style>
</head>

<body>

<main>

  <!-- HEADER -->
  <div class="hd">
    <img
      src="img/cabina.jpg"
      alt="Cabina profesional Don Omar Radio"
      onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=1000';">
  </div>

  <!-- PANEL CENTRAL -->
  <section class="panel">

    <h1>
      3 DÉCADAS COMPILANDO MUSICA, PERSONAS, Y TREMENDOS RECUERDOS; TE IDENTIFICAS?
    </h1>

    <div class="sub">Entonces disfrútalas.!!</div>

    <div class="hint">TOCA PARA CAMBIAR</div>

    <!-- GÉNERO -->
    <button class="gbtn" id="gb" type="button">
      <span class="gicon">♫</span>
      <span id="gt">GÉNERO MUSICAL</span>
      <span class="arrow">▼</span>
    </button>

    <!-- LISTA DE GÉNEROS -->
    <div id="bx"></div>

    <!-- VER TODO -->
    <button class="gbtn" id="all" type="button">
      <span class="gicon">≡</span>
      <span>VER TODO 60</span>
      <span class="arrow">▼</span>
    </button>

  </section>

  <!-- SLIDER -->
  <div class="wr" id="wr">
    <div class="tr" id="tr"></div>
  </div>

</main>

<!-- FOOTER -->
<footer>

  <div class="social">

    <button class="yt" type="button" aria-label="YouTube"
      onclick="window.open('https://www.youtube.com/','_blank')">▶</button>

    <button class="sp" type="button" aria-label="Spotify"
      onclick="window.open('https://open.spotify.com/','_blank')">♫</button>

    <button class="wa" type="button" aria-label="WhatsApp"
      onclick="window.open('https://wa.me/','_blank')">W</button>

    <button class="sh" type="button" aria-label="Compartir" onclick="sharePage()">↗</button>

  </div>

  <div class="dr">DR</div>
  <div class="brand">DonOmardesing 2026</div>
  <div class="small">60 PLAYLISTS REALES • 12 GÉNEROS • MÚSICA SIN PAUSAS</div>

</footer>

<script>
/* =========================================================
   DON OMAR RADIO 73
   ========================================================= */

/* 12 GÉNEROS */
const genres=[
  "ROCK",
  "POP",
  "ROCK EN ESPAÑOL",
  "SALSA",
  "MERENGUE",
  "VALLENATO",
  "REGGAE",
  "DISCO",
  "ELECTRÓNICA",
  "ROMÁNTICAS",
  "CLÁSICOS 70/80",
  "CLÁSICOS 90/2000"
];

/*
  Las 60 portadas se cargan directamente desde:
  img/01.jpg ... img/60.jpg

  Cambia solamente los títulos/géneros de este arreglo
  si quieres conservar los nombres exactos de tus playlists.
*/
const pls=[
  {t:"D todito Extreme vol 1",g:"ROCK"},
  {t:"D todito Extreme vol 2",g:"ROCK"},
  {t:"D todito Extreme vol 3",g:"ROCK"},
  {t:"Rock clásico vol 1",g:"ROCK"},
  {t:"Rock clásico vol 2",g:"ROCK"},

  {t:"Pop Hits vol 1",g:"POP"},
  {t:"Pop Hits vol 2",g:"POP"},
  {t:"Pop Hits vol 3",g:"POP"},
  {t:"Pop Memories",g:"POP"},
  {t:"Pop Forever",g:"POP"},

  {t:"Rock en español vol 1",g:"ROCK EN ESPAÑOL"},
  {t:"Rock en español vol 2",g:"ROCK EN ESPAÑOL"},
  {t:"Rock en español vol 3",g:"ROCK EN ESPAÑOL"},
  {t:"Rock latino",g:"ROCK EN ESPAÑOL"},
  {t:"Rock nacional",g:"ROCK EN ESPAÑOL"},

  {t:"Salsa clásica vol 1",g:"SALSA"},
  {t:"Salsa clásica vol 2",g:"SALSA"},
  {t:"Salsa brava",g:"SALSA"},
  {t:"Salsa romántica",g:"SALSA"},
  {t:"Salsa de colección",g:"SALSA"},

  {t:"Merengue clásico",g:"MERENGUE"},
  {t:"Merengue tropical",g:"MERENGUE"},
  {t:"Merengue de colección",g:"MERENGUE"},
  {t:"Merengue para bailar",g:"MERENGUE"},
  {t:"Merengue recuerdos",g:"MERENGUE"},

  {t:"Vallenato clásico",g:"VALLENATO"},
  {t:"Vallenato romántico",g:"VALLENATO"},
  {t:"Vallenato de colección",g:"VALLENATO"},
  {t:"Vallenato recuerdos",g:"VALLENATO"},
  {t:"Vallenato para cantar",g:"VALLENATO"},

  {t:"Reggae classics",g:"REGGAE"},
  {t:"Reggae roots",g:"REGGAE"},
  {t:"Reggae memories",g:"REGGAE"},
  {t:"Reggae selección",g:"REGGAE"},
  {t:"Reggae forever",g:"REGGAE"},

  {t:"Disco Fever vol 1",g:"DISCO"},
  {t:"Disco Fever vol 2",g:"DISCO"},
  {t:"Disco Classics",g:"DISCO"},
  {t:"Disco Memories",g:"DISCO"},
  {t:"Disco Night",g:"DISCO"},

  {t:"Electronic Classics",g:"ELECTRÓNICA"},
  {t:"Electronic Memories",g:"ELECTRÓNICA"},
  {t:"Dance Selection",g:"ELECTRÓNICA"},
  {t:"Dance Classics",g:"ELECTRÓNICA"},
  {t:"Electronic Night",g:"ELECTRÓNICA"},

  {t:"Románticas vol 1",g:"ROMÁNTICAS"},
  {t:"Románticas vol 2",g:"ROMÁNTICAS"},
  {t:"Románticas vol 3",g:"ROMÁNTICAS"},
  {t:"Baladas inolvidables",g:"ROMÁNTICAS"},
  {t:"Amores y recuerdos",g:"ROMÁNTICAS"},

  {t:"Clásicos 70/80 vol 1",g:"CLÁSICOS 70/80"},
  {t:"Clásicos 70/80 vol 2",g:"CLÁSICOS 70/80"},
  {t:"Clásicos 70/80 vol 3",g:"CLÁSICOS 70/80"},
  {t:"Golden Memories",g:"CLÁSICOS 70/80"},
  {t:"Oldies de colección",g:"CLÁSICOS 70/80"},

  {t:"90s & 2000s vol 1",g:"CLÁSICOS 90/2000"},
  {t:"90s & 2000s vol 2",g:"CLÁSICOS 90/2000"},
  {t:"90s & 2000s vol 3",g:"CLÁSICOS 90/2000"},
  {t:"Millennium Memories",g:"CLÁSICOS 90/2000"},
  {t:"Los inolvidables",g:"CLÁSICOS 90/2000"}
];

/* ESTADO */
let fl=pls.slice();
let ix=0;
let sx=0;

/* ELEMENTOS */
const tr=document.getElementById("tr");
const bx=document.getElementById("bx");
const gb=document.getElementById("gb");
const gt=document.getElementById("gt");
const wr=document.getElementById("wr");

/* CREAR LISTA DE GÉNEROS */
genres.forEach(g=>{
  const d=document.createElement("div");
  d.className="ge";
  d.textContent=g;
  d.dataset.genre=g;

  d.onclick=()=>{
    fl=pls.filter(p=>p.g===g);
    ix=0;
    gt.textContent=g+" • "+fl.length;
    bx.style.display="none";

    document.querySelectorAll(".ge").forEach(x=>x.classList.remove("ac"));
    d.classList.add("ac");

    rn();
  };

  bx.appendChild(d);
});

/* MOSTRAR / OCULTAR GÉNEROS */
gb.onclick=()=>{
  bx.style.display=bx.style.display==="block"?"none":"block";
};

/* VER TODO */
document.getElementById("all").onclick=()=>{
  fl=pls.slice();
  ix=0;
  gt.textContent="GÉNERO MUSICAL";

  document.querySelectorAll(".ge").forEach(x=>x.classList.remove("ac"));

  rn();
};

/* RENDER SLIDER */
function rn(){

  tr.innerHTML="";

  fl.forEach((p,i)=>{

    const n=String(pls.indexOf(p)+1).padStart(2,"0");

    const sl=document.createElement("div");
    sl.className="sl";

    const img=document.createElement("img");
    img.src="img/"+n+".jpg";
    img.alt=n+" • "+p.t;

    img.onerror=function(){
      this.onerror=null;
      this.src="https://i.scdn.co/image/ab67706c0000bebb"+n;
    };

    const ci=document.createElement("div");
    ci.className="ci";
    ci.textContent=n+" • "+p.t;

    const co=document.createElement("div");
    co.className="co";
    co.textContent=(i+1)+"/"+fl.length;

    const pl=document.createElement("button");
    pl.className="pl";
    pl.type="button";
    pl.innerHTML="▶";
    pl.setAttribute("aria-label","Reproducir "+p.t);

    /*
      Aquí puedes conectar posteriormente cada playlist
      con su archivo MP3 o URL de reproducción.
    */
    pl.onclick=()=>{
      if(p.url){
        window.open(p.url,"_blank");
      }
    };

    sl.appendChild(img);
    sl.appendChild(ci);
    sl.appendChild(co);
    sl.appendChild(pl);
    tr.appendChild(sl);
  });

  up();
}

/* POSICIÓN DEL SLIDER */
function up(){
  const w=wr.clientWidth;
  tr.style.transform="translateX(-"+(ix*w)+"px)";
}

/* SWIPE */
wr.addEventListener("touchstart",e=>{
  sx=e.changedTouches[0].screenX;
},{passive:true});

wr.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].screenX-sx;

  if(dx<-40 && ix<fl.length-1){
    ix++;
    up();
  }

  if(dx>40 && ix>0){
    ix--;
    up();
  }
},{passive:true});

/* AJUSTE AL ROTAR / CAMBIAR TAMAÑO */
window.addEventListener("resize",up);

/* COMPARTIR */
async function sharePage(){

  const data={
    title:"Don Omar Radio 73",
    text:"Don Omar Radio 73 — 60 playlists reales.",
    url:window.location.href
  };

  if(navigator.share){
    try{
      await navigator.share(data);
    }catch(e){}
  }else{
    try{
      await navigator.clipboard.writeText(window.location.href);
      alert("Enlace copiado.");
    }catch(e){
      alert(window.location.href);
    }
  }
}

/* INICIO */
rn();
</script>

</body>
</html>
