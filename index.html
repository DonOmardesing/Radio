<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Don Omar Radio</title>
<meta name="theme-color" content="#0066cc">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}
.header{background:linear-gradient(180deg,#001133 0%,#000 100%);padding:18px 0 10px;border-bottom:3px solid #0066cc;position:relative}
.logo{text-align:center}.logo img{width:100%;max-width:600px;height:auto;display:block;margin:0 auto}
.time-display{position:absolute;top:18px;right:18px;color:#fff;font-size:22px;font-weight:700;letter-spacing:2px;font-family:'Bebas Neue',cursive;background:rgba(0,0,0,.7);padding:6px 14px;border-radius:8px;border:2px solid #00ccff;box-shadow:0 0 18px rgba(0,204,255,.6);z-index:5}
.sound-wave{display:flex;justify-content:center;gap:4px;height:34px;align-items:center;margin:12px 0}.sound-wave span{width:4px;height:18px;background:linear-gradient(180deg,#0066cc,#00ccff);animation:wave .6s ease-in-out infinite}
.sound-wave span:nth-child(2){animation-delay:.1s}.sound-wave span:nth-child(3){animation-delay:.2s}.sound-wave span:nth-child(4){animation-delay:.3s}.sound-wave span:nth-child(5){animation-delay:.4s}.sound-wave span:nth-child(6){animation-delay:.5s}
@keyframes wave{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.section-title{text-align:center;color:#00ccff;font-size:26px;letter-spacing:5px;margin:22px 0 4px;font-family:'Bebas Neue',cursive}
.section-subtitle{text-align:center;color:#00ccff;font-size:14px;letter-spacing:4px;margin-bottom:16px;font-family:'Bebas Neue',cursive}
.stations-list{max-width:700px;margin:0 auto;padding:0 14px}
.station-block{margin-bottom:14px;border-radius:16px;overflow:hidden;border:3px solid #0066cc;background:#001133;transition:.3s}
.station-block.playing{border-color:#00ccff;box-shadow:0 0 28px rgba(0,204,255,.55)}
.station-img{width:100%;height:220px;background-size:cover;background-position:center}
.station-info{padding:12px;text-align:center;background:#001133}
.station-info h3{font-family:'Bebas Neue',cursive;font-size:26px;letter-spacing:3px;color:#fff;margin:0}
.station-info p{font-size:11px;color:#8aa0b5;letter-spacing:3px;margin-top:2px}
.player-area{background:#000a1a;padding:14px;display:flex;align-items:center;gap:12px}
.play-btn{width:62px;height:62px;border-radius:50%;border:3px solid #00ccff;background:radial-gradient(circle at 30% 30%,#003a75,#000);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:0 0 18px rgba(0,204,255,.6)}
.play-btn svg{width:26px;height:26px;fill:#fff;margin
