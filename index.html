const mp={"BALADAS INOLVIDABLES":[7,8,9,10,12,58,59,60],"SALSA DURA":[49,50,51,52,53],"MERENGUE CLÁSICO":[54,55,56,57,33],"REGGAETON OLD SCHOOL":[34,35,36,37,38],"REGGAETON NUEVO":[39,40,41,42,43],"BACHATA":[44,45,46,47],"ROCK EN ESPAÑOL":[11,13,48,30],"VALLENATO":[15,16,17,18],"CUMBIA & TROPICAL":[19,20,21,22],"80s / 90s HITS":[1,2,3,4],"ELECTRÓNICA / DANCE":[23,25,26,27],"EXTREME VOLÚMENES":[5,6,24,28,29,31,32,14]};
const generos=["TODOS","BALADAS INOLVIDABLES","SALSA DURA","MERENGUE CLÁSICO","REGGAETON OLD SCHOOL","REGGAETON NUEVO","BACHATA","ROCK EN ESPAÑOL","VALLENATO","CUMBIA & TROPICAL","80s / 90s HITS","ELECTRÓNICA / DANCE","EXTREME VOLÚMENES"];
let fl=pls.slice(),ix=0,gi=0;
function rn(){
  const tr=document.getElementById('tr'),w=document.getElementById('wr').clientWidth;
  tr.innerHTML='';
  fl.forEach((p,i)=>{
    const d=document.createElement('div');d.className='sl';d.style.width=w+'px';
    const pad=String(p.n).padStart(2,'0');
    d.innerHTML=`<img id="img-${p.id}" src="https://picsum.photos/seed/${p.id}/800/800" loading="lazy"><div class="co">${i+1}/${fl.length}</div><div class="ci">${pad} • ${p.t}</div><div class="pl" onclick="op('${p.id}')">▶</div>`;
    tr.appendChild(d);
    fetch(`https://open.spotify.com/oembed?url=https://open.spotify.com/playlist/${p.id}`).then(r=>r.json()).then(j=>{if(j.thumbnail_url){const el=document.getElementById(`img-${p.id}`);if(el)el.src=j.thumbnail_url;}}).catch(()=>{});
  });
  tr.style.width=fl.length*w+'px';up();
}
function up(){const w=document.getElementById('wr').clientWidth;document.getElementById('tr').style.transform=`translateX(-${ix*w}px)`;}
function op(id){document.getElementById('em').innerHTML=`<iframe src="https://open.spotify.com/embed/playlist/${id}" width="100%" height="380" frameborder="0" allow="encrypted-media"></iframe>`;document.getElementById('md').classList.add('on');}
document.getElementById('cl').onclick=()=>{document.getElementById('md').classList.remove('on');document.getElementById('em').innerHTML='';};
document.getElementById('gb').onclick=()=>{
  gi=(gi+1)%generos.length;
  const g=generos[gi];
  if(g==="TODOS"){fl=pls.slice();document.getElementById('gt').textContent='GÉNERO MUSICAL';}
  else{fl=pls.filter(p=>mp[g]&&mp[g].includes(p.n));document.getElementById('gt').textContent=g+' • '+fl.length;}
  ix=0;rn();
};
document.getElementById('ab').onclick=()=>{gi=0;fl=pls.slice();ix=0;document.getElementById('gt').textContent='GÉNERO MUSICAL';rn();};
let sx=0,sy=0,dx=0,dy=0,isH=false;
const wr=document.getElementById('wr');
wr.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;dy=0;isH=false;},{passive:true});
wr.addEventListener('touchmove',e=>{
  if(!sx)return;
  dx=e.touches[0].clientX-sx;dy=e.touches[0].clientY-sy;
  if(!isH&&Math.abs(dx)>10){isH=Math.abs(dx)>Math.abs(dy);}
  if(isH){e.preventDefault();}
},{passive:false});
wr.addEventListener('touchend',e=>{
  if(isH){
    if(dx<-40&&ix<fl.length-1){ix++;up();}
    if(dx>40&&ix>0){ix--;up();}
  }
  sx=0;isH=false;
},{passive:true});
window.addEventListener('resize',()=>{rn();});
rn();
</script>
