<html lang="es">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DON OMAR RADIO MEDELLIN</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:'Inter',sans-serif}
.hero{position:relative;width:100%;height:auto;overflow:hidden;background:#000}
.hero img{width:100%;height:auto;max-height:78vh;object-fit:cover;object-position:left center;filter:brightness(0.92) contrast(1.05);display:block}
.clock{position:absolute;top:12px;right:14px;z-index:5;background:rgba(0,0,0,0.75);border:1px solid rgba(255,255,255,0.3);color:#ffffff;font-family:monospace;font-size:18px;font-weight:900;padding:6px 10px;border-radius:6px;letter-spacing:2px;box-shadow:0 0 15px rgba(255,255,255,0.8), 0 0 30px rgba(0,229,255,0.3)}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.3) 60%, rgba(0,0,0,1) 100%)}
.waves{position:absolute;bottom:0;left:0;width:100%;height:60px;z-index:3;display:flex;align-items:flex-end;justify-content:center;gap:4px;padding:0 20px;background:linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%)}
.bar-eq{width:4px;background:linear-gradient(to top, #00e5ff, #ffffff);border-radius:2px 2px 0 0;animation:equalize 0.6s infinite ease-in-out alternate}
@keyframes equalize{0%{height:8px}100%{height:36px}}
.bar-eq:nth-child(2){animation-delay:0.1s; animation-duration:0.5s}
.bar-eq:nth-child(3){animation-delay:0.2s; animation-duration:0.7s}
.bar-eq:nth-child(4){animation-delay:0.15s; animation-duration:0.4s}
.bar-eq:nth-child(5){animation-delay:0.3s}
.bar-eq:nth-child(6){animation-delay:0.25s; animation-duration:0.8s}
.bar-eq:nth-child(7){animation-delay:0.1s}
.bar-eq:nth-child(8){animation-delay:0.35s}
.bar-eq:nth-child(9){animation-delay:0.05s}
.bar-eq:nth-child(10){animation-delay:0.2s}
.slogan{text-align:center;padding:28px 18px 18px;background:#000}
.slogan h1{font-family:'Bebas Neue';font-size:42px;letter-spacing:3px;line-height:1; color:#000; -webkit-text-stroke:1.5px #ffffff; text-stroke:1.5px #ffffff; text-shadow: 0 0 10px rgba(255,255,255,0.8), 2px 2px 0px #000;}
.slogan h1 span{color:#000; -webkit-text-stroke:1.5px #ffffff;}
.slogan p{color:#cde9ff;font-size:13px;margin-top:10px;letter-spacing:0.8px;line-height:1.4;font-style:italic;max-width:600px;margin-left:auto;margin-right:auto}
.grid{padding:18px 12px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:1100px;margin:0 auto}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr);gap:18px}}
.cajon{background:#0a0f1a;border:1px solid #0f274e;border-radius:14px;overflow:hidden;position:relative;transition:0.2s}
.cajon:hover{border-color:#00e5ff;transform:translateY(-3px);box-shadow:0 0 18px rgba(0,229,255,0.25)}
.cajon-cover{aspect-ratio:1/1.15;position:relative;overflow:hidden;background:#000;cursor:pointer}
.cajon-cover img{width:100%;height:100%;object-fit:cover}
.play-overlay{position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 60%);display:flex;align-items:flex-end;justify-content:flex-end;padding:10px}
.play-btn{width:44px;height:44px;border-radius:50%;background:rgba(0,229,255,0.95);border:2px solid #00e5ff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px #00e5ff}
.play-btn svg{width:18px;height:18px;fill:#000;margin-left:2px}
.cajon-info{padding:10px 10px 12px;background:#00102a}
.cajon-info h3{font-family:'Bebas Neue';font-size:17px;letter-spacing:1px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.cajon-info span{font-size:10px;color:#6b9bd1;letter-spacing:0.5px}
.embed-box{display:none}
.embed-box.active{display:block}
.embed-box iframe{width:100%;height:352px;border:0;display:block}
.footer{background:#000;border-top:2px solid #0f274e;margin-top:30px}
.siguenos{text-align:center;padding:28px 16px 18px;border-bottom:2px solid #0f274e}
.siguenos h2{font-family:'Bebas Neue';color:#00e5ff;letter-spacing:4px;font-size:26px;text-shadow:0 0 10px #00e5ff;margin-bottom:18px}
.socials{display:flex;justify-content:center;gap:16px}
.socials a{width:62px;height:62px;border-radius:16px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:26px;transition:0.2s}
.socials a.youtube{border:2px solid #ff0033;background:rgba(255,0,51,0.15);color:#ff0033;box-shadow:0 0 12px rgba(255,0,51,0.3)}
.socials a.spotify{border:2px solid #1ed760;background:rgba(30,215,96,0.15);color:#1ed760;box-shadow:0 0 12px rgba(30,215,96,0.3)}
.socials a.whatsapp{border:2px solid #25d366;background:rgba(37,211,102,0.15);color:#25d366;box-shadow:0 0 12px rgba(37,211,102,0.3)}
.socials a.tiktok{border:2px solid #ff0050;background:rgba(255,0,80,0.15);color:#ff0050;box-shadow:0 0 12px rgba(255,0,80,0.3)}
.socials a:hover{transform:scale(1.08)}
.brand{text-align:center;padding:38px 16px 30px}
.circle{width:130px;height:130px;margin:0 auto;border:3px solid #0f7bff;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 25px rgba(0,122,255,0.5), inset 0 0 20px rgba(0,122,255,0.15)}
.circle span{font-family:'Bebas Neue';color:#00e5ff;text-align:center;line-height:0.9;font-size:22px;letter-spacing:2px;text-shadow:0 0 12px #00e5ff}
.copy{margin-top:22px;color:#fff;font-size:12px;letter-spacing:2px;line-height:1.8;text-transform:uppercase}
</style>
</head>

// AUTO-FETCH nombres y portadas reales desde Spotify oEmbed (funciona en el navegador del cliente)
async function fetchSpotifyInfo(id, idx){
  try{
    const url = `https://open.spotify.com/oembed?url=https://open.spotify.com/playlist/${id}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('no ok');
    const data = await res.json();
    // data.title = "Nombre - playlist by ..."
    // Limpiar " - playlist by ..."
    let title = data.title ? data.title.replace(/ - playlist by .*/i,'').replace(/ - playlist .*/i,'').trim() : `COLECCION ${idx+1}`;
    let thumb = data.thumbnail_url || '';
    // Actualizar array
    PLAYLISTS[idx].t = title.toUpperCase();
    PLAYLISTS[idx].cover = thumb;
    // Actualizar DOM
    const card = document.querySelectorAll('.cajon')[idx];
    if(card){
      const img = card.querySelector('.cajon-cover img');
      const h3 = card.querySelector('.cajon-info h3');
      if(img && thumb) img.src = thumb;
      if(h3) h3.textContent = title.toUpperCase();
    }
  }catch(e){
    // Si falla, dejar placeholder
    console.log('Error fetch', id, e);
    const card = document.querySelectorAll('.cajon')[idx];
    if(card){
      const h3 = card.querySelector('.cajon-info h3');
      if(h3 && h3.textContent.includes('CARGANDO')) h3.textContent = `COLECCION ${idx+1}`;
    }
  }
}

// Lanzar fetch para todas
PLAYLISTS.forEach((p,i)=>{
  // Delay escalonado para no saturar
  setTimeout(()=>fetchSpotifyInfo(p.id,i), i*300);
});
