name: fix radio
on: push
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: |
          if ! grep -q "fix-todo.js" index.html; then
            sed -i 's|</body>|<script src="fix-todo.js"></script></body>|' index.html || echo '<script src="fix-todo.js"></script>' >> index.html
          fi
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: auto inject fix
